# Local development services. Production uses managed Postgres (Supabase) — see docs/plan.md §3.
name: ai-review

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aireview
      POSTGRES_PASSWORD: aireview
      POSTGRES_DB: aireview
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireview -d aireview"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
